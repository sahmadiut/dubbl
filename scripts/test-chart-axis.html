<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8">
<style>
  body { background: #09090b; color: #f4f4f5; font-family: system-ui, sans-serif; padding: 30px; }
  .card { background: #18181b; border: 1px solid #27272a; border-radius: 8px; padding: 20px; max-width: 700px; margin: 20px 0; }
  h3 { margin-top: 0; font-size: 14px; color: #a1a1aa; }
</style>
</head>
<body>

<div class="card">
  <h3>1. SVG with dir="ltr" on wrapper, width=80, tickMargin=8:</h3>
  <div dir="ltr" style="unicode-bidi: plaintext;">
    <svg width="600" height="220" style="overflow: visible;">
      <!-- Grid -->
      <line x1="80" y1="20" x2="580" y2="20" stroke="#27272a" stroke-dasharray="3 3" />
      <line x1="80" y1="65" x2="580" y2="65" stroke="#27272a" stroke-dasharray="3 3" />
      <line x1="80" y1="110" x2="580" y2="110" stroke="#27272a" stroke-dasharray="3 3" />
      <line x1="80" y1="155" x2="580" y2="155" stroke="#27272a" stroke-dasharray="3 3" />
      <line x1="80" y1="190" x2="580" y2="190" stroke="#27272a" />

      <!-- YAxis line -->
      <line x1="80" y1="20" x2="80" y2="190" stroke="#3f3f46" />

      <!-- Data line at y=190 -->
      <line x1="80" y1="190" x2="580" y2="190" stroke="#3b82f6" stroke-width="2" />

      <!-- Ticks at x=72 (text-anchor="end") -->
      <!-- What if tick text is: "۴" (just number)? -->
      <text x="72" y="24" fill="#a1a1aa" font-size="11" text-anchor="end">۴</text>
      <text x="72" y="69" fill="#a1a1aa" font-size="11" text-anchor="end">۳</text>
      <text x="72" y="114" fill="#a1a1aa" font-size="11" text-anchor="end">۲</text>
      <text x="72" y="159" fill="#a1a1aa" font-size="11" text-anchor="end">۱</text>
      <text x="72" y="194" fill="#a1a1aa" font-size="11" text-anchor="end">۰</text>
    </svg>
  </div>
</div>

<div class="card">
  <h3>2. SVG with width=85, tick text: "۴ ریال" or "ریال ۴" with clean LTR wrapper:</h3>
  <div dir="ltr" style="unicode-bidi: plaintext;">
    <svg width="600" height="220" style="overflow: visible;">
      <line x1="85" y1="20" x2="85" y2="190" stroke="#3f3f46" />
      <line x1="85" y1="190" x2="580" y2="190" stroke="#3b82f6" stroke-width="2" />

      <!-- If tick is formatted without the \u200E mark: e.g. "۴ ریال" -->
      <!-- Let's see how "۴ ریال" vs "ریال ۴" renders when text-anchor="end" -->
      <text x="75" y="24" fill="#a1a1aa" font-size="11" text-anchor="end" direction="ltr">۴ ریال</text>
      <text x="75" y="69" fill="#a1a1aa" font-size="11" text-anchor="end" direction="ltr">۳ ریال</text>
      <text x="75" y="114" fill="#a1a1aa" font-size="11" text-anchor="end" direction="ltr">۲ ریال</text>
      <text x="75" y="159" fill="#a1a1aa" font-size="11" text-anchor="end" direction="ltr">۱ ریال</text>
      <text x="75" y="194" fill="#a1a1aa" font-size="11" text-anchor="end" direction="ltr">۰ ریال</text>
    </svg>
  </div>
</div>

<div class="card">
  <h3>3. SVG with width=85, tick text: "ریال ۴" (Rial on left of number in LTR):</h3>
  <div dir="ltr" style="unicode-bidi: plaintext;">
    <svg width="600" height="220" style="overflow: visible;">
      <line x1="85" y1="20" x2="85" y2="190" stroke="#3f3f46" />
      <line x1="85" y1="190" x2="580" y2="190" stroke="#3b82f6" stroke-width="2" />

      <text x="75" y="24" fill="#10b981" font-size="11" text-anchor="end" direction="ltr">ریال ۴</text>
      <text x="75" y="69" fill="#10b981" font-size="11" text-anchor="end" direction="ltr">ریال ۳</text>
      <text x="75" y="114" fill="#10b981" font-size="11" text-anchor="end" direction="ltr">ریال ۲</text>
      <text x="75" y="159" fill="#10b981" font-size="11" text-anchor="end" direction="ltr">ریال ۱</text>
      <text x="75" y="194" fill="#10b981" font-size="11" text-anchor="end" direction="ltr">ریال ۰</text>
    </svg>
  </div>
</div>

</body>
</html>
